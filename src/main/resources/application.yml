spring:
  application:
    name: digital-wallet-api

  datasource:
    url: jdbc:postgresql://localhost:5432/wallet_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  # RabbitMQ Configuration (PR #3)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # MongoDB Configuration (PR #3)
  data:
    mongodb:
    #   uri: mongodb://root:password@localhost:27017/wallet_audit?authSource=admin
