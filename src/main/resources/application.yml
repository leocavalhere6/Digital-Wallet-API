spring:
  application:
    name: digital-wallet-api
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

api:
  security:
    jwt:
      secret: c3VwZXItc2VjcmV0LWtleS1mb3Itand0LXRlc3RzLW11c3QtYmUtbG9uZy1lbm91Z2g=
      expiration: 86400000
  client:
    authorizer:
      url: https://util.devi.tools/api/v2/authorize
    notification:
      url: https://util.devi.tools/api/v1/notify
